<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hive Shield</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111b21;
      color: #e9edef;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #222e35;
      padding-bottom: 10px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      color: #25d366;
    }
    .subtitle {
      font-size: 11px;
      color: #8696a0;
    }
    .status-card {
      background: #202c33;
      border-radius: 6px;
      padding: 12px;
      margin-top: 14px;
      font-size: 12px;
      border-left: 3px solid #25d366;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      background: #25d366;
      color: #111b21;
      font-weight: 700;
      font-size: 13px;
      border: none;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 12px;
      text-align: center;
      text-decoration: none;
    }
    .btn:hover {
      background: #1ebd5a;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <div class="title">🛡️ Hive Shield DVPS14</div>
      <div class="subtitle">WhatsApp Deepfake & Media Guard</div>
    </div>
  </div>

  <div class="status-card">
    <strong>Status: Active on WhatsApp Web</strong><br>
    Auto-inspecting forwarded videos and images for face-swaps, synthetic audio, and ELA artifacts.
  </div>

  <a class="btn" href="https://gentle-content-guard.lovable.app" target="_blank">
    🚀 Open Full Forensic Lab
  </a>
</body>
</html>
